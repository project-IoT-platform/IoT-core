<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f6;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;color:#eef1f6;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef1f6" style="background-color:#eef1f6;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">

                <!-- Шапка -->
                <tr>
                    <td bgcolor="#0b1f4b" style="background-color:#0b1f4b;padding:24px 32px;border-radius:10px 10px 0 0;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#ffffff;">{{platformName}}</td>
                                <td align="right" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#9fb3e0;">Уведомление</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Цветная полоса типа события -->
                <tr>
                    <td height="4" bgcolor="{{accentColor}}" style="background-color:{{accentColor}};font-size:0;line-height:0;height:4px;">&nbsp;</td>
                </tr>

                <!-- Карточка события -->
                <tr>
                    <td bgcolor="#ffffff" style="background-color:#ffffff;padding:32px;border-left:1px solid #dde2ec;border-right:1px solid #dde2ec;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="padding-bottom:12px;">
                                    <span style="display:inline-block;padding:4px 12px;border-radius:12px;background-color:{{accentColor}};font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;color:#ffffff;">{{badgeText}}</span>
                                </td>
                            </tr>
                            <tr>
                                <td style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#0b1f4b;padding-bottom:6px;">{{title}}</td>
                            </tr>
                            <tr>
                                <td style="font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#1b2430;padding-bottom:20px;">Устройство: <b>{{deviceName}}</b></td>
                            </tr>
                            <tr>
                                <td style="padding:14px 16px;background-color:#f7f9fc;border-left:4px solid {{accentColor}};font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#2b3445;">{{description}}</td>
                            </tr>
                            <tr>
                                <td style="padding-top:20px;">
                                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                        {{{detailsRows}}}
                                        <tr>
                                            <td style="padding:10px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#5b6577;">Время события</td>
                                            <td align="right" style="padding:10px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;color:#1b2430;">{{eventTime}}</td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td>{{{deviceLinkBlock}}}</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Подвал -->
                <tr>
                    <td bgcolor="#f7f9fc" style="background-color:#f7f9fc;padding:18px 32px;border:1px solid #dde2ec;border-top:0;border-radius:0 0 10px 10px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8590a3;">
                        Это автоматическое уведомление от {{platformName}}. Отвечать на письмо не нужно.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
