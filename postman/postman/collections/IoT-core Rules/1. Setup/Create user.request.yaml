$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"email":"rules-{{$timestamp}}@example.com","password":"12345678","username":"rules-test"}'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('deviceId', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('userId', pm.response.json().id);
    language: text/javascript
order: 1000
