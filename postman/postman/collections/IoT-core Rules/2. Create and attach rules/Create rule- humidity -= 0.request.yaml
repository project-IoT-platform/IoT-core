$kind: http-request
name: "Create rule: humidity >= 0"
url: "{{baseUrl}}/api/rules"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"telemetryType":2,"operator":"GE","value":0}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.test('оператор GE', () => pm.expect(r.operator).to.eql('GE'));
      pm.collectionVariables.set('ruleGeId', r.id);
    language: text/javascript
order: 1000
