$kind: http-request
name: value 120 (breaks <= 100, expect 400)
url: "{{baseUrl}}/api/telemetry"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"deviceId":"{{deviceId}}","time":"{{$isoTimestamp}}","telemetryType":2,"value":120}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('назван нарушенный предел', () => pm.expect(pm.response.text()).to.include('<= 100.0'));
    language: text/javascript
order: 4000
