$kind: http-request
url: "{{baseUrl}}/api/notifications/settings"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"norm":30,"deviation":4}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('норма обновилась', () => pm.expect(pm.response.json().norm).to.eql(30));
    language: text/javascript
order: 2000
