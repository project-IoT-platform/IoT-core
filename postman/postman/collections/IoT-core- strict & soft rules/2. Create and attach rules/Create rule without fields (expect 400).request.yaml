$kind: http-request
url: "{{baseUrl}}/api/rules"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('указаны все обязательные поля', () => {
        const e = pm.response.json();
        pm.expect(e).to.have.property('telemetryType');
        pm.expect(e).to.have.property('operator');
        pm.expect(e).to.have.property('value');
      });
      pm.test('strict не обязателен', () => pm.expect(pm.response.json()).to.not.have.property('strict'));
    language: text/javascript
order: 6000
