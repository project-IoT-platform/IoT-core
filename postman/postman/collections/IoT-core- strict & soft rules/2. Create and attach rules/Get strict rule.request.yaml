$kind: http-request
url: "{{baseUrl}}/api/rules/{{strictLeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const rule = pm.response.json();
      pm.test('strict — boolean и равен true', () => {
        pm.expect(rule.strict).to.be.a('boolean');
        pm.expect(rule.strict).to.eql(true);
      });
      pm.test('значение 100', () => pm.expect(rule.value).to.eql(100));
    language: text/javascript
order: 4000
