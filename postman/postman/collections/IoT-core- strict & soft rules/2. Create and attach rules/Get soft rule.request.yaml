$kind: http-request
url: "{{baseUrl}}/api/rules/{{softLeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const rule = pm.response.json();
      pm.test('нестрогое правило сохранилось как есть', () => {
        pm.expect(rule.strict).to.eql(false);
        pm.expect(rule.operator).to.eql('LE');
        pm.expect(rule.value).to.eql(30);
        pm.expect(rule.telemetryType).to.eql(3);
      });
    language: text/javascript
order: 5000
