services:
  postgres:
    image: postgres:16
    container_name: iot-db
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
    ports:
      - "5432:5432"
    volumes:
      - iot-db-data:/var/lib/postgresql/data


  rabbitmq:
    image: rabbitmq:4.1
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - iot-broker-data:/var/lib/rabbitmq

volumes:
  iot-db-data:
  iot-broker-data: